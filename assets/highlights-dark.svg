<svg xmlns="http://www.w3.org/2000/svg" width="900" height="215" viewBox="0 0 900 215" fill="none">
  <defs>
    <linearGradient id="bg-highlights-dark" x1="0" y1="0" x2="900" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d16"/>
      <stop offset="100%" stop-color="#111424"/>
    </linearGradient>
    <pattern id="grid-highlights-dark" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1a2036" stroke-width="0.75" opacity="0.5"/>
    </pattern>
    <clipPath id="clip-highlights-dark">
      <rect x="0.5" y="0.5" width="899" height="214" rx="16"/>
    </clipPath>
    
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .kicker { font-size: 10.5px; letter-spacing: 2.6px; fill: #89b4fa; font-weight: 600; }
    .title { font-size: 21px; fill: #eef2ff; font-weight: 600; }
    .muted { fill: #6c7086; }
    .sub { fill: #a6adc8; }
    
  </style>
  <g clip-path="url(#clip-highlights-dark)">
    <rect x="0" y="0" width="900" height="215" fill="url(#bg-highlights-dark)"/>
    <rect x="0" y="0" width="900" height="215" fill="url(#grid-highlights-dark)"/>
    
    <text x="48" y="42" class="mono kicker">CURRENT FOCUS</text>
    <text x="48" y="72" class="mono title">Ideas taking shape</text>
    <line x1="48" y1="92" x2="852" y2="92" stroke="#252c45" stroke-width="1" stroke-dasharray="4 8"/>
    <text x="48" y="128" class="mono kicker">01</text><text x="48" y="156" class="sans" font-size="16" font-weight="600" fill="#eef2ff">Automation &amp; Pipelines</text><text x="48" y="180" class="mono muted" font-size="11.5">Current focus</text><text x="330" y="128" class="mono kicker">02</text><text x="330" y="156" class="sans" font-size="16" font-weight="600" fill="#eef2ff">Local-First AI Runtimes</text><text x="330" y="180" class="mono muted" font-size="11.5">In the build queue</text><text x="612" y="128" class="mono kicker">03</text><text x="612" y="156" class="sans" font-size="16" font-weight="600" fill="#eef2ff">Gesture &amp; Mobile Systems</text><text x="612" y="180" class="mono muted" font-size="11.5">In the build queue</text>
    
  </g>
  <rect x="0.5" y="0.5" width="899" height="214" rx="16" stroke="#262c44" stroke-width="1"/>
</svg>
