<svg xmlns="http://www.w3.org/2000/svg" width="900" height="126" viewBox="0 0 900 126" fill="none">
  <defs>
    <linearGradient id="bg-social-light" x1="0" y1="0" x2="900" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fafbfe"/>
      <stop offset="100%" stop-color="#eff1f5"/>
    </linearGradient>
    <pattern id="grid-social-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#dce0e8" stroke-width="0.75" opacity="0.5"/>
    </pattern>
    <clipPath id="clip-social-light">
      <rect x="0.5" y="0.5" width="899" height="125" rx="16"/>
    </clipPath>
    
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .kicker { font-size: 10.5px; letter-spacing: 2.6px; fill: #1e66f5; font-weight: 600; }
    .title { font-size: 21px; fill: #1e1e2e; font-weight: 600; }
    .muted { fill: #7c7f93; }
    .sub { fill: #4c4f69; }
    
  </style>
  <g clip-path="url(#clip-social-light)">
    <rect x="0" y="0" width="900" height="126" fill="url(#bg-social-light)"/>
    <rect x="0" y="0" width="900" height="126" fill="url(#grid-social-light)"/>
    
    <line x1="48" y1="24" x2="852" y2="24" stroke="#bcc0cc" stroke-width="1" stroke-dasharray="4 8"/>
    
        <circle cx="52" cy="50" r="3" fill="#1e66f5"/>
        <text x="64" y="54" class="mono muted" font-size="10" letter-spacing="2">WEBSITE</text>
        <text x="48" y="86" class="mono" font-size="15" font-weight="600" fill="#1e1e2e">toru7.dev</text>
        
        <circle cx="260" cy="50" r="3" fill="#1e66f5"/>
        <text x="272" y="54" class="mono muted" font-size="10" letter-spacing="2">X / TWITTER</text>
        <text x="256" y="86" class="mono" font-size="15" font-weight="600" fill="#1e1e2e">@toruuzumi</text>
        
        <circle cx="468" cy="50" r="3" fill="#1e66f5"/>
        <text x="480" y="54" class="mono muted" font-size="10" letter-spacing="2">GITHUB</text>
        <text x="464" y="86" class="mono" font-size="15" font-weight="600" fill="#1e1e2e">@toruu7</text>
        
        <circle cx="676" cy="50" r="3" fill="#1e66f5"/>
        <text x="688" y="54" class="mono muted" font-size="10" letter-spacing="2">LINKEDIN</text>
        <text x="672" y="86" class="mono" font-size="15" font-weight="600" fill="#1e1e2e">Toru</text>
        
    
  </g>
  <rect x="0.5" y="0.5" width="899" height="125" rx="16" stroke="#ccd0da" stroke-width="1"/>
</svg>
