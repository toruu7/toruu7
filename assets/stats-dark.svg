<svg xmlns="http://www.w3.org/2000/svg" width="900" height="232" viewBox="0 0 900 232" fill="none">
  <defs>
    <linearGradient id="bg-stats-dark" x1="0" y1="0" x2="900" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d16"/>
      <stop offset="100%" stop-color="#111424"/>
    </linearGradient>
    <pattern id="grid-stats-dark" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1a2036" stroke-width="0.75" opacity="0.5"/>
    </pattern>
    <clipPath id="clip-stats-dark">
      <rect x="0.5" y="0.5" width="899" height="231" rx="16"/>
    </clipPath>
    
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .kicker { font-size: 10.5px; letter-spacing: 2.6px; fill: #89b4fa; font-weight: 600; }
    .title { font-size: 21px; fill: #eef2ff; font-weight: 600; }
    .muted { fill: #6c7086; }
    .sub { fill: #a6adc8; }
    
  </style>
  <g clip-path="url(#clip-stats-dark)">
    <rect x="0" y="0" width="900" height="232" fill="url(#bg-stats-dark)"/>
    <rect x="0" y="0" width="900" height="232" fill="url(#grid-stats-dark)"/>
    
    <text x="48" y="42" class="mono kicker">PROFILE SIGNAL</text>
    <text x="48" y="72" class="mono title">Momentum, made visible</text>
    <line x1="48" y1="92" x2="852" y2="92" stroke="#252c45" stroke-width="1" stroke-dasharray="4 8"/>
    
        <text x="48" y="142" class="mono" font-size="26" font-weight="700" fill="#eef2ff">22</text>
        <text x="48" y="164" class="mono muted" font-size="10" letter-spacing="2">REPOSITORIES</text>
        <circle cx="54" cy="194" r="6" fill="#89b4fa" fill-opacity="0.24" stroke="#89b4fa" stroke-width="1.2"/>
        <line x1="68" y1="194" x2="216" y2="194" stroke="#252c45" stroke-width="1" stroke-dasharray="4 8"/>
        
        <text x="256" y="142" class="mono" font-size="26" font-weight="700" fill="#eef2ff">24</text>
        <text x="256" y="164" class="mono muted" font-size="10" letter-spacing="2">STARS</text>
        <circle cx="262" cy="194" r="6" fill="#89b4fa" fill-opacity="0.24" stroke="#89b4fa" stroke-width="1.2"/>
        <line x1="276" y1="194" x2="424" y2="194" stroke="#252c45" stroke-width="1" stroke-dasharray="4 8"/>
        
        <text x="464" y="142" class="mono" font-size="26" font-weight="700" fill="#eef2ff">476</text>
        <text x="464" y="164" class="mono muted" font-size="10" letter-spacing="2">CONTRIBUTIONS</text>
        <circle cx="470" cy="194" r="6" fill="#89b4fa" fill-opacity="0.24" stroke="#89b4fa" stroke-width="1.2"/>
        <line x1="484" y1="194" x2="632" y2="194" stroke="#252c45" stroke-width="1" stroke-dasharray="4 8"/>
        
        <text x="672" y="142" class="mono" font-size="26" font-weight="700" fill="#eef2ff">7</text>
        <text x="672" y="164" class="mono muted" font-size="10" letter-spacing="2">FOLLOWERS</text>
        <circle cx="678" cy="194" r="6" fill="#89b4fa" fill-opacity="0.24" stroke="#89b4fa" stroke-width="1.2"/>
        <line x1="692" y1="194" x2="840" y2="194" stroke="#252c45" stroke-width="1" stroke-dasharray="4 8"/>
        
    
  </g>
  <rect x="0.5" y="0.5" width="899" height="231" rx="16" stroke="#262c44" stroke-width="1"/>
</svg>
